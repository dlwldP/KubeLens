[project]
name = "kubelens"
version = "0.1.0"
description = "자연어로 묻는 read-only Kubernetes 진단 도구"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=31.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kind: kind 클러스터(make phase0 완료 상태)가 필요한 통합 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
