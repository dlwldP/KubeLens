[project]
name = "kubelens"
version = "0.1.0"
description = "자연어로 묻는 read-only Kubernetes 진단 도구"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "kubernetes>=31.0.0",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kind: kind 클러스터(make phase0 완료 상태)가 필요한 통합 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"kubelens/agent/prompts.py" = ["E501"]
