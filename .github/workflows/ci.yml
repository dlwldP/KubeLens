name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "실제 LLM으로 평가 하네스 실행 (ANTHROPIC_API_KEY 시크릿 필요, API 비용 발생)"
        type: boolean
        default: true
      scenarios:
        description: "평가할 시나리오 (예: S1 또는 S1,S3). 비우면 S1~S6 전체"
        type: string
        default: ""

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint
      - name: shellcheck
        run: shellcheck infra/*.sh chaos/*.sh backend/scripts/*.sh
      - run: make test-unit

  macos:
    name: macOS lint + unit tests (로컬 실행 환경 확인)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint
      - run: make test-unit
      - name: macOS 기본 bash(3.2)로 스크립트 문법 확인
        run: |
          /bin/bash --version | head -1
          for f in infra/*.sh chaos/*.sh backend/scripts/*.sh; do /bin/bash -n "$f" && echo "ok $f"; done

  kind:
    name: phase0 + kind integration tests
    runs-on: ubuntu-24.04
    needs: unit
    env:
      KIND_VERSION: v0.29.0
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: make phase0 (cluster, RBAC, chaos S1~S6, verify)
        run: make phase0

      - run: make setup
      - name: make test-kind
        run: make test-kind

      - name: "Phase 4·5: API 서버 기동 (실제 kind + 대본 LLM, API 키 불필요)"
        run: |
          cd backend
          for port in 8000 8001; do
            KUBELENS_DB_URL=sqlite:///$RUNNER_TEMP/ci-$port.db \
            KUBELENS_LLM_FACTORY=tests.fake_llms:scripted_llms \
              nohup uv run uvicorn kubelens.api.app:app --port $port > "$RUNNER_TEMP/api-$port.log" 2>&1 &
          done
          for port in 8000 8001; do
            for i in $(seq 1 60); do curl -fs localhost:$port/api/sessions >/dev/null && break; sleep 1; done
          done

      - name: "Phase 4: curl SSE 이벤트 순서 검사"
        run: API=http://127.0.0.1:8001 bash backend/scripts/sse-smoke.sh

      - name: "Phase 5: Playwright e2e (클러스터 설정 → 질문 → 트레이스 → 증거 모달 → 히스토리)"
        run: |
          (cd frontend && npx playwright install --with-deps chromium)
          make e2e

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/e2e-results/
          if-no-files-found: ignore

      - name: "Docker 이미지: 빌드 후 kind 연결 테스트"
        run: |
          docker build -t kubelens:ci .
          docker run -d --name kubelens-ci --network host --user "$(id -u):$(id -g)" \
            -e HOST=127.0.0.1 -e PORT=8002 \
            -v "$PWD/infra/kubelens.kubeconfig:/kube/config:ro" kubelens:ci
          for i in $(seq 1 60); do curl -fs localhost:8002/api/sessions >/dev/null && break; sleep 1; done
          curl -fs localhost:8002/ | grep -q "<title>KubeLens</title>"
          CID=$(curl -fs -X POST localhost:8002/api/clusters -H 'content-type: application/json' \
            -d '{"name":"docker"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          RES=$(curl -fs -X POST "localhost:8002/api/clusters/$CID/test")
          echo "$RES"
          echo "$RES" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"], r'

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kubelens get nodes -o wide || true
          kubectl --context kind-kubelens get pods -A -o wide || true
          kubectl --context kind-kubelens -n kubelens-chaos describe pods || true
          kubectl --context kind-kubelens -n kubelens-chaos get events --sort-by=.lastTimestamp || true
          cat "$RUNNER_TEMP"/api-*.log || true
          docker logs kubelens-ci || true

      - name: Delete cluster
        if: always()
        run: make cluster-down || true

  eval:
    name: "eval: S1~S6 실제 LLM 평가 (수동 실행)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-24.04
    needs: unit
    env:
      KIND_VERSION: v0.29.0
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check ANTHROPIC_API_KEY
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 저장소 시크릿이 없습니다 (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind

      - run: make phase0
      - run: make setup

      - name: make eval
        run: make eval SCENARIOS="${{ inputs.scenarios }}"

      - name: 결과 요약
        if: always()
        run: cat eval/results/latest.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-results
          path: eval/results/latest.*
          if-no-files-found: ignore

      - name: Delete cluster
        if: always()
        run: make cluster-down || true
