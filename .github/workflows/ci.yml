name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "실제 LLM으로 평가 하네스 실행 (ANTHROPIC_API_KEY 시크릿 필요, API 비용 발생)"
        type: boolean
        default: true
      scenarios:
        description: "평가할 시나리오 (예: S1 또는 S1,S3). 비우면 S1~S6 전체"
        type: string
        default: ""

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make lint
      - run: make test-unit

  kind:
    name: phase0 + kind integration tests
    runs-on: ubuntu-24.04
    needs: unit
    env:
      KIND_VERSION: v0.29.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: make phase0 (cluster, RBAC, chaos S1~S6, verify)
        run: make phase0

      - run: make setup
      - name: make test-kind
        run: make test-kind

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kubelens get nodes -o wide || true
          kubectl --context kind-kubelens get pods -A -o wide || true
          kubectl --context kind-kubelens -n kubelens-chaos describe pods || true
          kubectl --context kind-kubelens -n kubelens-chaos get events --sort-by=.lastTimestamp || true

      - name: Delete cluster
        if: always()
        run: make cluster-down || true

  eval:
    name: "eval: S1~S6 실제 LLM 평가 (수동 실행)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-24.04
    needs: unit
    env:
      KIND_VERSION: v0.29.0
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check ANTHROPIC_API_KEY
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 저장소 시크릿이 없습니다 (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind

      - run: make phase0
      - run: make setup

      - name: make eval
        run: make eval SCENARIOS="${{ inputs.scenarios }}"

      - name: 결과 요약
        if: always()
        run: cat eval/results/latest.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/latest.*
          if-no-files-found: ignore

      - name: Delete cluster
        if: always()
        run: make cluster-down || true
