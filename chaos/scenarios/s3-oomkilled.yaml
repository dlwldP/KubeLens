# S3: memory limit 32Mi인데 150M 할당 시도 → OOMKilled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: kubelens-chaos
  labels:
    kubelens.io/scenario: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
        kubelens.io/scenario: s3
    spec:
      containers:
        - name: worker
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 32Mi }
