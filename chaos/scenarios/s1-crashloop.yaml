# S1: 필수 환경변수 DB_HOST 누락 → 시작 직후 exit 1 → CrashLoopBackOff
# 로그에 가짜 api_key를 남겨 Phase 1 마스킹 테스트에도 사용한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: kubelens-chaos
  labels:
    kubelens.io/scenario: s1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        kubelens.io/scenario: s1
    spec:
      containers:
        - name: api
          image: busybox:1.36
          env:
            - name: DB_PORT
              value: "5432"
          command: ["sh", "-c"]
          args:
            - |
              echo "INFO starting payment-api v1.4.2"
              echo "DEBUG loaded config api_key=kl-fake-0000000000000000"
              if [ -z "$DB_HOST" ]; then
                echo "FATAL required environment variable DB_HOST is not set"
                exit 1
              fi
              sleep 3600
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
