# S6: 존재하지 않는 ConfigMap 참조 → CreateContainerConfigError
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: kubelens-chaos
  labels:
    kubelens.io/scenario: s6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        kubelens.io/scenario: s6
    spec:
      containers:
        - name: order
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: order-service-config
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
