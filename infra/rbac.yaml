# KubeLens read-only 권한 (기획서 12장)
# secrets, configmaps, pods/exec 및 모든 쓰기 동사는 의도적으로 제외한다.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelens-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelens-reader
  namespace: kubelens-system
---
# 장기 토큰 (로컬 kind 전용)
apiVersion: v1
kind: Secret
metadata:
  name: kubelens-reader-token
  namespace: kubelens-system
  annotations:
    kubernetes.io/service-account.name: kubelens-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubelens-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelens-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubelens-readonly
subjects:
  - kind: ServiceAccount
    name: kubelens-reader
    namespace: kubelens-system
